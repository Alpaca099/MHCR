[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mhcr"
version = "0.1.0"
description = "Coverage-calibrated cell routing over IVF-PQ"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.24", "torch>=2.0", "faiss-cpu>=1.7", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
mhcr-pipeline = "mhcr.pipeline:main"
mhcr-qps = "mhcr.benchmark.qps_cli:main"
mhcr-build = "mhcr.cli:build_main"
mhcr-train = "mhcr.cli:train_main"
mhcr-evaluate = "mhcr.cli:evaluate_main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "__pycache__/*"]

[tool.setuptools.package-data]
"mhcr.serving" = ["fp16.cpp"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
